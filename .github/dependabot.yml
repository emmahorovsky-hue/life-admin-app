version: 2

# The Security Audit job in ci.yml is a hard gate: a new moderate+ advisory in
# the dependency tree fails every build until someone fixes it. Dependabot is
# the other half of that deal — it opens the fixing PR itself, so an advisory
# published on a Tuesday is a pull request rather than a blocked main branch.
#
# Updates are grouped so routine version bumps arrive as one PR per ecosystem
# per week. Security patches are not grouped: they come as their own PRs so
# they can be reviewed and merged on their own.
updates:
  # Single npm entry: the root lockfile covers all four workspaces
  # (packages/shared, client, server, mobile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind 4 is a ground-up rewrite (CSS-first config, separate
      # @tailwindcss/postcss plugin) — upgrading is a dedicated migration,
      # not a routine bump. Remove once the migration lands.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

      # React Native minors are majors in all but name, and nothing in CI
      # builds the iOS app, so the breakage they cause is invisible here.
      # 0.86 -> 0.87 removed React/RCTRootContentView.h, which
      # react-native-gesture-handler 2.x imports: the iOS build stops
      # compiling until gesture-handler goes to 3.x, a major this group does
      # not carry. PR #345 shipped that bump with every check green and was
      # only caught by building it on a simulator by hand. Upgrading React
      # Native is a dedicated migration; remove this once one lands.
      #
      # This does not hide React Native security advisories: the Security
      # Audit gate fails the build on a moderate+ advisory in the tree
      # whatever dependabot does or does not open.
      - dependency-name: react-native
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']

      # The same reasoning, one layer out: these are the third-party *native*
      # modules whose versions Expo SDK 57 pins in its bundledNativeModules.json.
      # They ship platform code, so a mismatch surfaces at build or run time on
      # a device — and no CI job here builds the iOS app, so every check stays
      # green regardless. PR #352 proposed six of them at once, each one drifting
      # further from the version Expo expects.
      #
      # The supported way to move these is `npx expo install --check` (or an SDK
      # upgrade), which picks the set Expo has actually tested together. Bumping
      # them one PR at a time defeats that. `npx expo-doctor` reports the drift.
      #
      # Scoped to minors and majors on purpose: patches are routine bugfixes, and
      # leaving them unblocked keeps a fix reaching us as an ordinary version
      # update. Security advisories are unaffected either way — the Security
      # Audit gate fails the build on a moderate+ advisory in the tree no matter
      # what dependabot opens.
      #
      # Remove an entry here when its package stops being Expo-managed, or fold
      # the whole block into the next SDK upgrade.
      - dependency-name: react-native-reanimated
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-worklets
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-screens
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-safe-area-context
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-gesture-handler
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native-svg
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@shopify/react-native-skia'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@react-native-community/datetimepicker'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@sentry/react-native'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Pinned action versions go stale and are a supply-chain surface of their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
